name: Release (Desktop-Client, Docker-Image & CapRover-Deploy)

# Bei einem Versions-Tag (v1.2.3), damit die Webseite schnell aktuell ist:
#  1. sofort (parallel zum Desktop-Client) ein Docker-Image ohne
#     Installationsdateien bauen (`:v1.2.3-web`) und auf CapRover ausrollen,
#  2. Desktop-Client für Windows und Linux bauen und als Entwurf eines
#     GitHub-Releases hochladen,
#  3. danach das endgültige Image mit genau diesen Installationsdateien
#     (Download über die Weboberfläche) bauen – dank Build-Cache nur die
#     letzte Schicht – und nach GHCR pushen (`:v1.2.3`, `:1.2`, `:latest`),
#  4. es erneut ausrollen.
# Ausgerollt wird nur, wenn die Secrets CAPROVER_SERVER, CAPROVER_APP und
# CAPROVER_APP_TOKEN gesetzt sind.
# Manuell (Run workflow) auf einem Branch: nur der Desktop-Client.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli,cargo-about
      - name: Drittanbieter-Lizenzen aktualisieren
        run: |
          cargo fetch
          cargo about generate --offline about.hbs -o crates/web/licenses.html
      # Version aus dem Tag; Update-Dateien (*.sig) nur mit Signaturschlüssel
      - name: Release-Konfiguration
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          conf=crates/desktop/tauri.conf.json
          jq --arg v "${TAG#v}" --argjson sign "$HAS_KEY" \
            '(if $v != "" then .version = $v else . end) | .bundle.createUpdaterArtifacts = $sign' \
            "$conf" > conf.tmp && mv conf.tmp "$conf"
          jq '{version, createUpdaterArtifacts: .bundle.createUpdaterArtifacts}' "$conf"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – Desktop-Client ohne Update-Signaturen gebaut."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUERO_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          tauriScript: cargo tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Büro ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Installationsdateien sammeln
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p desktop-dist
          # Installationsdateien und ihre Signaturen (für Updates)
          cp target/release/bundle/*/*.{exe,msi,deb,rpm,AppImage}{,.sig} desktop-dist/
          ls -l desktop-dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: 7

  # Schnell: Image ohne Desktop-Installationsdateien, sofort ausrollen
  image-web:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/buero:${GITHUB_REF_NAME}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: BUERO_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-web:
    needs: image-web
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: caprover-deploy
      cancel-in-progress: false
    steps:
      - name: Auf CapRover ausrollen (ohne Desktop-Installationsdateien)
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          IMAGE: ${{ needs.image-web.outputs.image }}
        run: |
          if [ -z "$CAPROVER_SERVER" ] || [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::warning::CapRover-Secrets fehlen – Image gebaut, aber nicht ausgerollt."
            exit 0
          fi
          echo "Rolle $IMAGE auf $CAPROVER_APP aus …"
          npx --yes caprover deploy \
            --caproverUrl "$CAPROVER_SERVER" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "$CAPROVER_APP" \
            --imageName "$IMAGE"

  # Endgültig: Image mit den Installationsdateien des Desktop-Clients
  image:
    needs: [desktop, image-web]
    # image-web nur abwarten (Build-Cache), nicht von seinem Erfolg abhängen
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Installationsdateien des Desktop-Clients
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true
      - id: name
        run: |
          ls -l desktop-dist
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${owner}/buero" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/buero:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.repo }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUERO_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Erst nach dem schnellen Ausrollen, damit nie das ältere Image zuletzt landet
    needs: [image, deploy-web]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: caprover-deploy
      cancel-in-progress: false
    steps:
      - name: Auf CapRover ausrollen
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ -z "$CAPROVER_SERVER" ] || [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::warning::CapRover-Secrets fehlen – Image gebaut, aber nicht ausgerollt."
            exit 0
          fi
          echo "Rolle $IMAGE auf $CAPROVER_APP aus …"
          npx --yes caprover deploy \
            --caproverUrl "$CAPROVER_SERVER" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "$CAPROVER_APP" \
            --imageName "$IMAGE"
