# Konfiguration für cargo-about: erzeugt die Übersicht der Drittanbieter-Lizenzen
#   cargo about generate about.hbs -o crates/web/licenses.html
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "zlib-acknowledgement",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    # webpki-roots (Stammzertifikate für TLS im Desktop-Client)
    "CDLA-Permissive-2.0",
]
# Eigene Crates (AGPL) nicht auflisten
private = { ignore = true }
ignore-build-dependencies = false
ignore-dev-dependencies = true
