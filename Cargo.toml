[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/web", "crates/desktop", "crates/vfs"]
# Standard-Build (cargo build) baut nur den Server; Web (wasm) wird mit trunk,
# Desktop mit tauri gebaut.
default-members = ["crates/server"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Manfred Roßkamp"]
repository = "https://github.com/ManniManfred/Buero"

[workspace.dependencies]
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.release.package.web]
opt-level = "z"
