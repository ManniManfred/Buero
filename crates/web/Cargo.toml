[package]
name = "web"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Location", "History", "Storage", "File", "FileList", "FormData",
  "DataTransfer", "DragEvent", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent",
  "Blob", "BlobPropertyBag", "HtmlTextAreaElement", "Element", "Navigator", "DomRect", "HtmlAudioElement", "HtmlMediaElement",
] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
