[package]
name = "buero-server"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "buero-server"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "compression-br", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tantivy = "0.24"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
num_cpus = "1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
percent-encoding = "2"
hmac = "0.12"
base64 = "0.22"
tar = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
