[package]
name = "buero-desktop"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Büro – Desktop-Client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
# WinFsp-DLL wird erst beim Einbinden geladen (fehlt WinFsp, startet Büro trotzdem)
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
buero-vfs = { path = "../vfs" }
tokio = { version = "1", features = ["sync"] }

[features]
# Von der Tauri-CLI im Release-Build gesetzt
custom-protocol = ["tauri/custom-protocol"]
