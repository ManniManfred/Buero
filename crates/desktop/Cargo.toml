[package]
name = "buero-desktop"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Büro – Desktop-Client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Mit Windows starten (Registry „Run“), Linux: ~/.config/autostart
tauri-plugin-autostart = "2"
# Zweiter Start holt das laufende Fenster nach vorn (Sync-Ordner nur einmal verbinden)
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
buero-vfs = { path = "../vfs" }
tokio = { version = "1", features = ["sync"] }

[features]
# Von der Tauri-CLI im Release-Build gesetzt
custom-protocol = ["tauri/custom-protocol"]
